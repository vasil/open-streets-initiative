[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-streets-initiative"
version = "0.1.0"
description = "Local-first CLI for Strava import, sensor logs, and wheelchair road-burden analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
osi = "open_streets_initiative.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
